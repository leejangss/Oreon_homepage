<style>
  .oreon-products-hero,
  .oreon-products-hero * { box-sizing: border-box; }

  .oreon-products-hero {
    position: relative;
    overflow: hidden;
    width: 100%;
    min-height: 100svh;
    height: clamp(660px, 100svh, 1000px);
    padding: 48px 0 42px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    background: #000107;
    font-family: 'Outfit', sans-serif;
  }

  @keyframes oreonProductsSealTurn {
    from { transform: translateY(calc(-50% - 50px)) rotate(0deg); }
    to   { transform: translateY(calc(-50% - 50px)) rotate(360deg); }
  }

  @keyframes oreonProductsLineGlow {
    0%,100% { opacity: .20; }
    22%     { opacity: .50; }
    48%     { opacity: .30; }
    72%     { opacity: .68; }
  }

  @keyframes oreonProductsLineCore {
    0%,100% { opacity: .58; }
    20%     { opacity: .94; }
    46%     { opacity: .72; }
    70%     { opacity: 1; }
  }

  .oreon-products-hero__line-glow {
    animation: oreonProductsLineGlow 5.6s ease-in-out infinite;
    will-change: opacity;
  }

  .oreon-products-hero__line-core {
    animation: oreonProductsLineCore 5.6s ease-in-out infinite;
    will-change: opacity;
  }

  .oreon-products-hero__seal {
    position: absolute;
    right: clamp(-100px, -4vw, -30px);
    top: 38.5%;
    width: clamp(208px, 24vw, 384px);
    height: clamp(208px, 24vw, 384px);
    opacity: .85;
    pointer-events: none;
    animation: oreonProductsSealTurn 24s linear infinite;
  }

  .oreon-products-hero__content {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 1440px;
    margin: 0 auto;
    padding: 0 clamp(24px, 8vw, 160px);
    transform: translateY(-220px);
  }

  .oreon-products-hero__copy {
    display: flex;
    flex-direction: column;
    max-width: 720px;
  }

  .oreon-products-hero__eyebrow {
    display: inline-flex;
    align-items: center;
    font-size: 11px;
    letter-spacing: .26em;
    text-transform: uppercase;
    color: #4FC3F7;
    font-weight: 600;
  }

  .oreon-products-hero__title {
    margin: 24px 0 0;
    max-width: 1100px;
    white-space: nowrap;
    font-weight: 300;
    font-size: clamp(56px, 7vw, 104px);
    line-height: 1.02;
    letter-spacing: 0;
    color: #f5f7fc;
  }

  .oreon-products-hero__title-line { display: block; }

  .oreon-products-hero__gradient-word {
    font-weight: 400;
    background: linear-gradient(90deg,
      #ffffff 0%,
      #e9f6ff 22%,
      #b9ddff 52%,
      #78baff 78%,
      #4FC3F7 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    text-shadow: 0 0 28px rgba(79,195,247,.08);
  }

  .oreon-products-hero__sub {
    margin: 28px 0 0;
    max-width: 60ch;
    white-space: nowrap;
    font-family: 'IBM Plex Sans', Arial, sans-serif;
    font-weight: 300;
    font-size: clamp(13px, 1vw, 15px);
    line-height: 1.8;
    letter-spacing: .1em;
    color: #c0c9d8;
  }

  @media (max-width: 900px) {
    .oreon-products-hero__content { transform: translateY(-130px); }
    .oreon-products-hero__title { white-space: normal; }
    .oreon-products-hero__sub { white-space: normal; }
  }

  @media (max-width: 560px) {
    .oreon-products-hero { min-height: 720px; height: auto; }
    .oreon-products-hero__content { transform: translateY(-90px); }
  }

  @media (prefers-reduced-motion: reduce) {
    .oreon-products-hero__seal,
    .oreon-products-hero__line-glow,
    .oreon-products-hero__line-core { animation: none !important; }
  }
</style>

<style>
  .oreon-products-cards,
  .oreon-products-cards * { box-sizing: border-box; }

  .oreon-products-cards {
    width: 100%;
    padding: clamp(48px, 7vw, 88px) 0;
    background: linear-gradient(180deg, #02040b 0%, #050a13 100%);
    font-family: 'Outfit', sans-serif;
  }

  .oreon-products-cards__inner {
    width: 100%;
    max-width: 1280px;
    margin: 0 auto;
    padding: 0 24px;
  }

  .oreon-material-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 28px;
  }

  .oreon-material-card-reveal {
    width: 100%;
    min-width: 0;
    box-sizing: border-box;
  }

  .oreon-material-card {
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    width: 100%;
    max-width: 100%;
    min-width: 0;
    aspect-ratio: 4 / 5;
    padding: 24px;
    border-radius: 16px;
    border: 1px solid rgba(255,255,255,.09);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.07), 0 24px 48px -30px rgba(2,5,10,.7);
    text-decoration: none;
    cursor: pointer;
    transform: scale(1);
    transform-origin: center;
    transition:
      transform .34s cubic-bezier(.22,.61,.36,1),
      filter .34s ease,
      border-color .34s ease;
    will-change: transform, filter;
  }

  .oreon-material-card__shade {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,.55) 0%, rgba(0,0,0,.15) 45%, transparent 70%);
    pointer-events: none;
  }

  .oreon-material-card h3 {
    position: relative;
    z-index: 1;
    margin: 0;
    color: #eef1f6;
    font-size: 1.35rem;
    font-weight: 300;
  }

  /* Hover: tiny scale-up + the brighter/bluer card-image tone approved in the final review. */
  @media (hover: hover) and (pointer: fine) {
    .oreon-material-card:hover {
      transform: scale(1.01);
      filter: brightness(1.085) saturate(1.12) contrast(1.018);
      border-color: rgba(79,195,247,.24);
    }
  }

  /* JS only hides cards after motion is initialized, so cards never disappear if JS fails. */
  .oreon-products-cards.motion-ready .oreon-material-card-reveal {
    opacity: 0;
    transform: translateY(34px);
  }

  .oreon-products-cards.motion-ready .oreon-material-card-reveal.is-visible {
    opacity: 1;
    transform: translateY(0);
    transition:
      opacity .82s cubic-bezier(.16,1,.3,1),
      transform .82s cubic-bezier(.16,1,.3,1);
  }

  .oreon-products-cards.motion-ready .oreon-material-card-reveal:nth-child(1)  { transition-delay: .05s; }
  .oreon-products-cards.motion-ready .oreon-material-card-reveal:nth-child(2)  { transition-delay: .12s; }
  .oreon-products-cards.motion-ready .oreon-material-card-reveal:nth-child(3)  { transition-delay: .19s; }
  .oreon-products-cards.motion-ready .oreon-material-card-reveal:nth-child(4)  { transition-delay: .26s; }
  .oreon-products-cards.motion-ready .oreon-material-card-reveal:nth-child(5)  { transition-delay: .10s; }
  .oreon-products-cards.motion-ready .oreon-material-card-reveal:nth-child(6)  { transition-delay: .17s; }
  .oreon-products-cards.motion-ready .oreon-material-card-reveal:nth-child(7)  { transition-delay: .24s; }
  .oreon-products-cards.motion-ready .oreon-material-card-reveal:nth-child(8)  { transition-delay: .31s; }
  .oreon-products-cards.motion-ready .oreon-material-card-reveal:nth-child(9)  { transition-delay: .15s; }
  .oreon-products-cards.motion-ready .oreon-material-card-reveal:nth-child(10) { transition-delay: .22s; }
  .oreon-products-cards.motion-ready .oreon-material-card-reveal:nth-child(11) { transition-delay: .29s; }
  .oreon-products-cards.motion-ready .oreon-material-card-reveal:nth-child(12) { transition-delay: .36s; }

  @media (max-width: 900px) {
    .oreon-material-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
  }

  @media (max-width: 560px) {
    .oreon-material-grid { grid-template-columns: 1fr; }
  }

  @media (prefers-reduced-motion: reduce) {
    .oreon-products-cards.motion-ready .oreon-material-card-reveal,
    .oreon-products-cards.motion-ready .oreon-material-card-reveal.is-visible {
      opacity: 1 !important;
      transform: none !important;
      transition: none !important;
    }
    .oreon-material-card { transition: none !important; }
  }
</style>

<script>
(function () {
  const section = document.getElementById('oreon-products-cards');
  if (!section || section.dataset.motionInit === '1') return;
  section.dataset.motionInit = '1';

  const cards = Array.from(section.querySelectorAll('.oreon-material-card-reveal'));
  if (!cards.length) return;

  if (!('IntersectionObserver' in window) || window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    cards.forEach(card => card.classList.add('is-visible'));
    return;
  }

  section.classList.add('motion-ready');

  const observer = new IntersectionObserver((entries, obs) => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      entry.target.classList.add('is-visible');
      obs.unobserve(entry.target);
    });
  }, { threshold: 0.12, rootMargin: '0px 0px -5% 0px' });

  cards.forEach(card => observer.observe(card));
})();
</script>
