<meta charset="UTF-8">
<!-- OREON IR : HERO SECTION ONLY / V11 Title Ring Brighter -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
html,body{margin:0!important;padding:0!important;width:100%;background:#02040b;overflow-x:hidden}
body{min-width:0}
.oreon-ir-hero,.oreon-ir-hero *{box-sizing:border-box}
.oreon-ir-hero{
  position:relative;overflow:hidden;width:100%;height:clamp(610px,37vw,670px);
  background:#000107;font-family:'Outfit',sans-serif
}
@keyframes oreonIRSealTurn{from{transform:translateY(calc(-50% - 5px)) rotate(0)}to{transform:translateY(calc(-50% - 5px)) rotate(360deg)}}
@keyframes oreonIRBreath{0%,100%{opacity:.58}50%{opacity:1}}
@keyframes oreonIRDawnBreath{0%,100%{opacity:.28}50%{opacity:.54}}
@keyframes oreonIRTitleGradientFlow{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

.oreon-ir-hero__seal{
  position:absolute;right:clamp(-100px,-4vw,-30px);top:41.5%;
  width:clamp(230px,23.04vw,384px);height:clamp(230px,23.04vw,384px);
  opacity:.85;pointer-events:none;animation:oreonIRSealTurn 24s linear infinite
}
.oreon-ir-hero__content{
  position:absolute;z-index:2;top:clamp(72px,5.6vw,92px);left:50%;transform:translateX(-50%);
  width:100%;max-width:1280px;padding:0 24px
}
.oreon-ir-hero__copy{display:flex;flex-direction:column;max-width:720px}
.oreon-ir-hero__eyebrow{display:inline-flex;align-items:center;font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:#4FC3F7;font-weight:600}
.oreon-ir-hero__title{margin:18px 0 0;max-width:1100px;white-space:nowrap;font-weight:300;font-size:clamp(48px,5.1vw,82px);line-height:1.02;color:#f5f7fc}
.oreon-ir-hero__title-line{display:block}
.oreon-ir-hero__gradient-word{
  font-weight:400;background:linear-gradient(90deg,#fff 0%,#e9f6ff 16%,#b9ddff 34%,#78baff 50%,#4FC3F7 66%,#9adfff 82%,#fff 100%);
  background-size:240% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
  text-shadow:0 0 28px rgba(79,195,247,.08);animation:oreonIRTitleGradientFlow 7s ease-in-out infinite
}
.oreon-ir-hero__sub{margin:22px 0 0;max-width:60ch;white-space:nowrap;font-family:'IBM Plex Sans',Arial,sans-serif;font-weight:300;font-size:clamp(13px,1vw,15px);line-height:1.8;letter-spacing:.1em;color:#c0c9d8}

.oreon-ir-horizon-core{animation:oreonIRBreath 6.8s ease-in-out infinite}
.oreon-ir-dawn-glow{animation:oreonIRDawnBreath 7.2s ease-in-out infinite}
@media(max-width:900px){
  .oreon-ir-hero__content{top:72px;left:0;transform:none;padding-inline:40px}
  .oreon-ir-hero__title,.oreon-ir-hero__sub{white-space:normal}
}
@media(max-width:560px){
  .oreon-ir-hero{height:600px}
  .oreon-ir-hero__content{top:58px;padding-inline:24px}
}
@media(prefers-reduced-motion:reduce){
  .oreon-ir-hero__seal,.oreon-ir-horizon-core,.oreon-ir-dawn-glow,.oreon-ir-hero__gradient-word{animation:none!important}
}
</style>

<!-- COMMON HERO VISUAL SYSTEM: keep horizon geometry/dawn glow identical across IR / Products / News; change only page copy + rotating label -->
<section class="oreon-ir-hero" aria-label="Investor Relations hero">
  <div aria-hidden="true" style="position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden">
    <svg viewBox="0 0 1672 941" preserveAspectRatio="none" style="display:block;width:100%;height:100%">
      <defs>
        <linearGradient id="oreon-ir-edgefade" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#000"/>
          <stop offset=".10" stop-color="#fff"/>
          <stop offset=".93" stop-color="#fff"/>
          <stop offset="1" stop-color="#000"/>
        </linearGradient>
        <mask id="oreon-ir-mask"><rect width="1672" height="941" fill="url(#oreon-ir-edgefade)"/></mask>

        <linearGradient id="oreon-ir-core" x1="0" y1="0" x2="1672" y2="0" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#0742c6" stop-opacity=".92"/>
          <stop offset=".16" stop-color="#1d84ff" stop-opacity="1"/>
          <stop offset=".42" stop-color="#25bcff" stop-opacity="1"/>
          <stop offset=".66" stop-color="#40e1ff" stop-opacity="1"/>
          <stop offset=".78" stop-color="#43d8ff" stop-opacity="1"/>
          <stop offset=".88" stop-color="#1ebdff" stop-opacity=".98"/>
          <stop offset=".96" stop-color="#0d7bff" stop-opacity=".72"/>
          <stop offset="1" stop-color="#0848c8" stop-opacity="0"/>
        </linearGradient>

        <linearGradient id="oreon-ir-outerglow" x1="0" y1="0" x2="1672" y2="0" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#08369c" stop-opacity="0"/>
          <stop offset=".18" stop-color="#0b55dc" stop-opacity=".16"/>
          <stop offset=".46" stop-color="#0d76ff" stop-opacity=".28"/>
          <stop offset=".68" stop-color="#18bfff" stop-opacity=".42"/>
          <stop offset=".82" stop-color="#22d8ff" stop-opacity=".36"/>
          <stop offset=".93" stop-color="#137fff" stop-opacity=".16"/>
          <stop offset="1" stop-color="#0b48c6" stop-opacity="0"/>
        </linearGradient>

        <radialGradient id="oreon-ir-rightdawn" cx="50%" cy="50%" r="50%">
          <stop offset="0" stop-color="#18bfff" stop-opacity=".36"/>
          <stop offset=".28" stop-color="#1189ff" stop-opacity=".24"/>
          <stop offset=".56" stop-color="#0c56d6" stop-opacity=".11"/>
          <stop offset="1" stop-color="#04153e" stop-opacity="0"/>
        </radialGradient>

        <radialGradient id="oreon-ir-tophaze" cx="50%" cy="50%" r="50%">
          <stop offset="0" stop-color="#0f76ff" stop-opacity=".14"/>
          <stop offset=".36" stop-color="#0b53cf" stop-opacity=".08"/>
          <stop offset="1" stop-color="#02040b" stop-opacity="0"/>
        </radialGradient>

        <filter id="oreon-ir-line-soft" filterUnits="userSpaceOnUse" x="-400" y="300" width="2500" height="500">
          <feGaussianBlur stdDeviation="7"/>
        </filter>
        <filter id="oreon-ir-line-soft-wide" filterUnits="userSpaceOnUse" x="-500" y="260" width="2800" height="620">
          <feGaussianBlur stdDeviation="18"/>
        </filter>
      </defs>

      <rect width="1672" height="941" fill="#000107"/>

      <g mask="url(#oreon-ir-mask)">
        <!-- very soft upper-right dawn haze, like the reference -->
        <ellipse class="oreon-ir-dawn-glow" cx="1375" cy="505" rx="430" ry="180" fill="url(#oreon-ir-tophaze)" opacity=".48"/>
        <ellipse class="oreon-ir-dawn-glow" cx="1415" cy="520" rx="600" ry="250" fill="url(#oreon-ir-rightdawn)" opacity=".56"/>

        <!-- keep glow attached to the line instead of large free-floating blur -->
        <path class="oreon-ir-dawn-glow"
              d="M-135 835 C210 718 505 610 790 553 C1060 498 1318 484 1565 487 C1710 489 1772 494 1826 499"
              fill="none" stroke="url(#oreon-ir-outerglow)" stroke-width="34"
              filter="url(#oreon-ir-line-soft-wide)" stroke-linecap="round" opacity=".40"/>

        <path class="oreon-ir-dawn-glow"
              d="M-135 835 C210 718 505 610 790 553 C1060 498 1318 484 1565 487 C1710 489 1772 494 1826 499"
              fill="none" stroke="url(#oreon-ir-outerglow)" stroke-width="12"
              filter="url(#oreon-ir-line-soft)" stroke-linecap="round" opacity=".68"/>

        <path class="oreon-ir-horizon-core"
              d="M-135 835 C210 718 505 610 790 553 C1060 498 1318 484 1565 487 C1710 489 1772 494 1826 499"
              fill="none" stroke="url(#oreon-ir-core)" stroke-width="3.2"
              stroke-linecap="round" opacity="1"/>
      </g>
    </svg>
  </div>
  </div>

  <svg class="oreon-ir-hero__seal" viewBox="0 0 500 500" aria-hidden="true">
    <defs><path id="oreon-ir-seal-circle" pathLength="100" d="M250 22a228 228 0 1 1 0 456a228 228 0 1 1 0-456"/></defs>
    <text fill="#c4d7f4" style="font:400 16px Outfit,sans-serif;letter-spacing:5px;word-spacing:4px">
      <textPath href="#oreon-ir-seal-circle">The Value &#183; We Build Together &#183; The Value &#183; We Build Together &#183; The Value &#183; We Build Together &#183; The Value &#183; We Build Together &#183; The Value &#183; We Build Together &#183; The Value &#183; We Build Together &#183;</textPath>
    </text>
  </svg>

  <div class="oreon-ir-hero__content">
    <div class="oreon-ir-hero__copy">
      <span class="oreon-ir-hero__eyebrow">INVESTOR RELATIONS</span>
      <h1 class="oreon-ir-hero__title">
        <span class="oreon-ir-hero__title-line">The <span class="oreon-ir-hero__gradient-word">Value</span></span>
        <span class="oreon-ir-hero__title-line">We Build <span class="oreon-ir-hero__gradient-word">Together.</span></span>
      </h1>
      <p class="oreon-ir-hero__sub">Rooted in timeless values, driven by innovation &#8212; creating a future that serves both<br>people and progress.</p>
    </div>
  </div>
</section>

<script>
(function(){
  function sendHeight(){
    var h=Math.max(document.documentElement.scrollHeight,document.body?document.body.scrollHeight:0);
    try{window.parent.postMessage({type:'oreon-ir-hero-height',height:h},'*')}catch(e){}
  }
  window.addEventListener('load',function(){sendHeight();setTimeout(sendHeight,300)});
  window.addEventListener('resize',sendHeight);
  if('ResizeObserver' in window){new ResizeObserver(sendHeight).observe(document.documentElement)}
})();
</script>
