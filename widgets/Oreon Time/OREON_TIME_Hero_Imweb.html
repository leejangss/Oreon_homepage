<!-- 아임웹 코드 위젯용 히어로. 다음 카테고리 영역에 id="oreon-categories"를 지정하세요. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Outfit:wght@400;600;900&display=swap">
<style id="rh-style">
#rh-hero,#rh-rows{--rh-display:'Outfit',Arial,sans-serif;font-family:'Outfit',Arial,sans-serif;box-sizing:border-box}
#rh-hero *,#rh-rows *{box-sizing:border-box}
#rh-hero{height:100svh;min-height:650px;background:#0a0a0a;color:#f5f5f5;position:relative;display:flex;align-items:center;padding:100px 24px 90px;overflow:hidden}
#rh-hero .rh-headline{width:100%;margin:0;font:900 15.2vw/1 var(--rh-display)!important;text-transform:uppercase;letter-spacing:-.05em;color:#f5f5f5}
#rh-hero .rh-line{display:flex;align-items:center;justify-content:center;gap:.12em;white-space:nowrap;padding:.025em 0;overflow:hidden}
#rh-hero .rh-line>span{display:block;font:inherit!important;animation:rhEnter 1.2s cubic-bezier(.14,1,.34,1) both}
#rh-hero .rh-line:nth-child(2)>span{animation-delay:.13s}
#rh-hero em{font-style:normal!important;font-size:inherit!important;line-height:inherit!important;display:inline-block;transform:skew(-10deg);color:inherit}
#rh-hero .rh-film{--fw:1.3em;width:var(--fw);height:.725em;align-self:center;flex-shrink:0;transform:skew(-10deg);overflow:hidden;position:relative;background:#222}
#rh-hero .rh-film img{width:124%!important;max-width:none!important;height:100%!important;object-fit:cover;position:absolute;left:-12%;top:0;transform:skew(10deg);opacity:0;transition:opacity .6s}
#rh-hero .rh-film img.on{opacity:1}#rh-hero .rh-film img{transition:opacity .25s!important}
#rh-hero .rh-bottom{position:absolute;bottom:24px;left:24px;right:24px;display:flex;align-items:end;justify-content:space-between;font-size:20px;color:#f5f5f5}
#rh-hero .rh-down{border:1px solid #383838;width:48px;height:48px;display:grid;place-items:center;color:#fff;text-decoration:none;transition:background .2s}
#rh-hero .rh-down:hover{background:#0c00ff;border-color:#0c00ff}
#rh-rows{padding:45px 24px 50px;min-height:calc(100svh - 98px);display:flex;flex-direction:column;justify-content:center;overflow:hidden;position:relative;background:#f5f5f5;color:#0a0a0a}
#rh-rows .rh-tag{align-self:flex-start;display:inline-block;padding:10px 14px;border:1px solid #ccc;font:800 18px/1 var(--rh-display)!important;margin-bottom:24px;text-transform:uppercase}
#rh-rows .rh-list{display:flex;flex-direction:column;align-items:center;gap:16px}
#rh-rows .rh-row{display:flex;align-items:center;justify-content:center;gap:10px;font:900 clamp(44px,min(10.2vw,calc((100svh - 300px) / 4.1)),200px)/.88 var(--rh-display)!important;text-transform:uppercase;letter-spacing:-.045em;color:#0a0a0a;text-decoration:none;transition:transform .65s cubic-bezier(.14,1,.34,1),opacity .65s;transform:translateX(var(--drift,0px));opacity:1}
#rh-rows .rh-row figure{width:var(--cap,.725em);height:var(--cap,.725em);margin:0;flex-shrink:0;overflow:hidden;transition:transform .35s}
#rh-rows .rh-row img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .7s}
#rh-rows .rh-row:nth-child(even){flex-direction:row-reverse}
#rh-rows .rh-row span{font:inherit!important;transition:transform .35s,color .35s;transform-origin:center bottom}
#rh-rows .rh-row:hover span,#rh-rows .rh-row:focus-visible span{transform:skew(-10deg);color:var(--c)}
#rh-rows .rh-row:hover figure{transform:skew(-8deg)}
#rh-rows .rh-row:hover img{transform:scale(1.1) skew(8deg)}
#rh-rows .rh-row.pending{opacity:0;transform:translateX(90px)}
#rh-rows .rh-row:nth-child(even).pending{transform:translateX(-90px)}
@keyframes rhEnter{from{transform:translateY(115%)}to{transform:translateY(0)}}
/* 처음엔 텍스트만 → 가운데가 벌어지며 영상(사진) 등장 */
#rh-hero .rh-film{animation:rhOpen 1.1s cubic-bezier(.7,0,.2,1) 1.5s both}
@keyframes rhOpen{from{width:0;margin:0 -.06em;opacity:.0}12%{opacity:1}to{width:var(--fw);margin:0;opacity:1}}
#rh-hero .rh-film img{animation:rhKen 2.4s ease-in-out infinite alternate}
@keyframes rhKen{from{transform:skew(10deg) scale(1)}to{transform:skew(10deg) scale(1.12) translateX(-3%)}}
#rh-hero .rh-measure .rh-film{animation:none!important;width:var(--fw)!important;margin:0!important}
@media(max-width:767px){#rh-hero{padding:90px 16px;min-height:520px}#rh-hero .rh-headline{font-size:14vw!important}#rh-hero .rh-bottom{left:16px;right:16px;font-size:14px;gap:20px}#rh-rows{padding:28px 12px;min-height:70svh}#rh-rows .rh-row{font-size:10.5vw!important}#rh-rows .rh-row figure{width:var(--cap,.725em);height:var(--cap,.725em)}#rh-rows .rh-list{gap:22px}}
@media(prefers-reduced-motion:reduce){#rh-hero *,#rh-rows *{animation:none!important;transition:none!important}#rh-rows .rh-row.pending{opacity:1;transform:none}}
html body #rh-hero .rh-headline *,html body #rh-rows .rh-row *,html body #rh-rows .rh-tag{font-family:var(--rh-display)!important;font-weight:900!important}
html body #rh-hero .rh-bottom,html body #rh-hero .rh-bottom *{font-family:'Outfit',Arial,sans-serif!important}
/* 스크롤 줌: 히어로 고정 → 영상 프레임이 화면 전체로 확대 → 다음 섹션 */
#rh-pin{position:relative;height:250vh}
#rh-pin #rh-hero{position:sticky;top:0}
#rh-hero .rh-zoom{position:absolute;left:0;top:0;width:0;height:0;overflow:hidden;z-index:3;opacity:0;pointer-events:none;will-change:left,top,width,height,transform}
#rh-hero .rh-zoom img{position:absolute;left:-6%;top:0;width:112%!important;max-width:none!important;height:100%!important;object-fit:cover;object-position:50% 70%}
#rh-hero .rh-headline,#rh-hero .rh-bottom{will-change:opacity,transform}
@media(prefers-reduced-motion:reduce){#rh-pin{height:auto}#rh-pin #rh-hero{position:relative}#rh-hero .rh-zoom{display:none}}
/* 좌우 여백: 사이트 공통 여백 */
#rh-hero{padding-left:var(--_layout---container--margin,clamp(24px,7vw,140px))!important;padding-right:var(--_layout---container--margin,clamp(24px,7vw,140px))!important}
#rh-hero .rh-bottom{left:var(--_layout---container--margin,clamp(24px,7vw,140px))!important;right:var(--_layout---container--margin,clamp(24px,7vw,140px))!important}
/* 히어로 헤드라인만 콘덴스드 폰트 */
html body #rh-hero .rh-headline,html body #rh-hero .rh-headline *:not(#_a):not(#_b):not(#_c):not(#_d){font-family:'Anton',Impact,sans-serif!important;font-weight:400!important;letter-spacing:0!important}
#rh-hero .rh-headline{line-height:1.02!important}
#rh-hero .rh-film{height:.86em!important}
/* 확대 이미지 잘림 방지: 전체 이미지(contain) + 뒤에 같은 이미지 블러로 채움 */
#rh-hero .rh-zoom{background:#0a0a0a}
#rh-hero .rh-zoom .rh-zbg{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(28px) brightness(.55);transform:scale(1.1)}
#rh-hero .rh-zoom img{object-fit:cover!important;z-index:1;}
</style><style id="oreon-zoom-fix">
#rh-hero .rh-zoom>img{position:absolute!important;display:block!important;margin:0!important;padding:0!important;border:0!important;max-width:none!important;max-height:none!important;object-fit:contain!important;object-position:center center!important;z-index:1!important}
#rh-hero .rh-zoom .rh-zbg{display:block!important;position:absolute!important;inset:-40px!important;z-index:0!important}
</style>

<script>
(function(){
  var hl=document.querySelector('#rh-hero .rh-headline');
  function fit(){if(!hl)return;hl.style.fontSize='';var fs=parseFloat(getComputedStyle(hl).fontSize),avail=hl.clientWidth*0.98,k=9;[].forEach.call(hl.querySelectorAll('.rh-line'),function(l){var t=0;[].forEach.call(l.children,function(c){if(c.classList.contains('rh-film'))t+=fs*(1.3+.725*.18);else t+=c.getBoundingClientRect().width;});t+=parseFloat(getComputedStyle(l).columnGap||0)*(l.children.length-1);k=Math.min(k,avail/t);});hl.style.setProperty('font-size',(fs*k)+'px','important');}
  fit();addEventListener('resize',fit);addEventListener('load',fit);if(document.fonts){document.fonts.ready.then(fit);document.fonts.addEventListener&&document.fonts.addEventListener('loadingdone',fit);}setTimeout(fit,600);setTimeout(fit,2800);
  var f=[].slice.call(document.querySelectorAll('#rh-hero .rh-film img')),k=0;if(f.length>1)setTimeout(function(){setInterval(function(){f[k].classList.remove('on');k=(k+1)%f.length;f[k].classList.add('on');},700);},2600);

  /* 스크롤 줌 */
  (function(){var pin=document.getElementById('rh-pin'),hero=document.getElementById('rh-hero'),z=hero&&hero.querySelector('.rh-zoom'),zi=z&&z.querySelector('img'),film=hero&&hero.querySelector('.rh-film'),bt=hero&&hero.querySelector('.rh-bottom');
    if(!pin||!z||!film||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
    var tk=false;function ease(x){return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;}
    function up(){tk=false;var r=pin.getBoundingClientRect(),H=hero.offsetHeight,W=hero.offsetWidth,run=pin.offsetHeight-H,p=Math.max(0,Math.min(1,-r.top/run)),e=ease(Math.min(1,p/.85));
      var hr=hero.getBoundingClientRect(),fr=film.getBoundingClientRect(),fx=fr.left-hr.left,fy=fr.top-hr.top,fw=film.offsetWidth,fh=film.offsetHeight;
      if(p<=0.001){z.style.opacity=0;film.style.visibility='';hl.style.opacity='';hl.style.transform='';bt.style.opacity='';return;}
      var sk=-10*(1-e);
      z.style.opacity=1;film.style.visibility='hidden';
      z.style.left=(fx+(0-fx)*e)+'px';z.style.top=(fy+(0-fy)*e)+'px';z.style.width=(fw+(W-fw)*e)+'px';z.style.height=(fh+(H-fh)*e)+'px';
      z.style.transform='skew('+sk+'deg)';var nb=0;zi.style.top=(nb*e)+'px';zi.style.setProperty('left',(-6*(1-e))+'%','important');zi.style.setProperty('width',(100+12*(1-e))+'%','important');zi.style.objectPosition='50% 55%';zi.style.setProperty('height','calc(100% - '+(nb*e)+'px)','important');zi.style.transform='skew('+(-sk)+'deg) scale('+(1.08-.08*e)+')';
      hl.style.opacity=String(Math.max(0,1-e*1.6));hl.style.transform='scale('+(1+e*.25)+')';bt.style.opacity=String(Math.max(0,1-e*3));}
    addEventListener('scroll',function(){if(!tk){tk=true;requestAnimationFrame(up);}},{passive:true});addEventListener('resize',up);up();})();
})();
</script>
