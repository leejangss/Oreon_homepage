function render(names){const sig=names.map(norm).join('|');if(root.dataset.signature===sig)return;root.dataset.signature=sig;cats=names;rowList.replaceChildren();valueList.replaceChildren();names.forEach((name,i)=>{const matching=KNOWN.findIndex(x=>x.toUpperCase()===name.toUpperCase());const img=matching<0?'':ORIGINAL.images[matching],desc=matching<0?'':ORIGINAL.descs[matching];const row=document.createElement('button');row.type='button';row.className='rh-row pending';row.dataset.otCat=name;row.style.setProperty('--c',['#0c00ff','#ff00f2','#b200ff','#0c00ff'][i%4]);const word=document.createElement('span');word.className='rh-word';word.textContent=name;row.append(word);if(img){const figure=document.createElement('figure'),pic=document.createElement('img');pic.src=img;pic.alt='OREON TIME — '+name;pic.loading='lazy';figure.append(pic);row.append(figure)}row.addEventListener('click',()=>choose(name,true));rowList.append(row);

render(KNOWN);let last='';function scan(){const found=readBoard();if(!found.length)return;const sig=found.map(norm).join('|');if(sig!==last){last=sig;render(found)}}scan();let attempts=0;const timer=setInterval(()=>{scan();if(++attempts>=40)clearInterval(timer)},1500);const board=document.getElementById(WIDGET_ID);if(board){const observer=new MutationObserver(()=>scan());observer.observe(board,{subtree:true,childList:true})}
if('IntersectionObserver' in window){const valuesObserver=new IntersectionObserver(entries=>{const visible=entries.filter(e=>e.isIntersecting).sort((a,b)=>b.intersectionRatio-a.intersectionRatio);if(visible.length){root.querySelectorAll('.ot-value').forEach(el=>el.classList.toggle('is-active',el===visible[0].target));}},{rootMargin:'-25% 0px -30% 0px',threshold:[0,.25,.5]});valueList.querySelectorAll('.ot-value').forEach(el=>valuesObserver.observe(el))}
})();
</script></body></html>
