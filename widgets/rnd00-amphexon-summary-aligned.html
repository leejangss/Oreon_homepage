  세 이미지를 하나의 코드로 합쳤어요. 박스는 연결선/점 없이 새로 그렸어요.
-->
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500&display=swap');
  .amps-wrap {
    width: 100%;
    background: #01030f;
    padding: 40px 24px;
    box-sizing: border-box;
    font-family: 'IBM Plex Sans', 'imweb Sans', -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  }
  .amps-inner {
    max-width: 1280px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }

  .amps-left {
    container-type: inline-size;
    flex: 1 1 340px;
    max-width: 676px;
    min-width: 0;
  }
  .amps-title-img {
    transform-origin: 6.03% 66%;
    transform: scale(1.2);
    position: relative;
    top: -40px;
    width: 100%;
    display: block;
    margin-bottom: 28px;
    transition: transform .3s cubic-bezier(.16,1,.3,1);
  }
  .amps-title-art {
    width: 100%;
    display: block;
    clip-path: inset(0 0 36% 0);
  }
  .amps-subtitle {
    position: absolute;
    top: 66%;
    left: 6.03%;
    width: 79.3%;
    height: auto;
    overflow: visible;
    margin: 0;
    color: #fff;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 4.6cqw;
    font-weight: 400;
    line-height: 1.2;
    white-space: nowrap;
  }
  .amps-title-content {
    position: relative;
    transform-origin: center center;
    transition: transform .3s cubic-bezier(.16,1,.3,1);
  }
  .amps-title-img:hover .amps-title-content {
    transform: scale(1.04);
  }

  .amps-box {
    position: relative;
    top: 8px;
    left: 5px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: calc(80% + 40px);
    max-width: calc(80% + 40px);
    min-width: 0;
    margin-left: 6.03%; /* 제목 이미지 속 AMPHEXON의 시작점(59 / 978)에 정렬 */
    border: 1.5px solid transparent;
    background: linear-gradient(#0a1030, #0a1030) padding-box, linear-gradient(135deg, #c9a8ec, #7ec5f0) border-box;
    box-shadow: 0 0 18px 1px rgba(150,170,255,.3), 0 0 36px 6px rgba(120,140,255,.15);
    border-radius: 14px;
    padding: 14px 18px;
    margin-bottom: 22px;
    transition: transform .3s cubic-bezier(.16,1,.3,1), box-shadow .3s ease;
  }
  .amps-box:hover {
    transform: scale(1.05);
    box-shadow: 0 0 26px 2px rgba(150,170,255,.45), 0 0 50px 10px rgba(120,140,255,.22);
  }
  .amps-box:last-child { margin-bottom: 0; }
  .amps-box-title {
    font-size: 26px;
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 500;
    color: #ffffff;
  }
  .amps-pill {
    display: inline-block;
    padding: 10px 20px;
    border-radius: 999px;
    background: #01030f;
    font-size: 15px;
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 500;
  }
  .amps-pill.elastic { color: #c9a8ec; }
  .amps-pill.cohesive { color: #8ec4f5; }

  .amps-right {
    flex: 1.6 1 420px;
    max-width: 1039px;
    margin-top: 20px;
    min-width: 0;
  }
  .amps-chart-frame {
    background: #01030f;
    border-radius: 28px;
    padding: 40px 8px;
  }
  .amps-chart-img {
    width: 100%;
    display: block;
    border-radius: 20px;
    transition: transform .3s cubic-bezier(.16,1,.3,1);
  }
  .amps-chart-img:hover {
    transform: scale(1.04);
  }

  /* Desktop offset estimated from the supplied page screenshot. */
  @media (min-width: 1100px) {
    .amps-right { position: relative; left: 6.6vw; }
  }
  @media (max-width: 860px) {
    .amps-inner { justify-content: center; }
  }
</style>
